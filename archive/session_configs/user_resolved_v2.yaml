# ARCHIVED, 2026-08-26 (CANONICAL_SESSION_MIGRATION_REPORT.md): session.asian_start_local/
# asian_end_local below (00:00-08:00 Europe/London LOCAL, DST-following) predate and disagree
# with CANONICAL_SESSION_WINDOWS_V1 in both timezone basis and hours. This yaml file itself has
# zero programmatic consumers (moved here purely as documentation); its logic is implemented as
# hardcoded, DST-following ZoneInfo("Europe/London") arithmetic in session_strategy/source_v2.py
# (used by replay_source_v2.py, replay_source_v2_agent.py, tests/test_source_v2.py). That module
# was NOT force-migrated: like source_v1.py, it replays one specific, already-flagged-unverified
# historical research artifact (claimed source "1BullBear Episode 18", verification_status:
# NOT_INDEPENDENTLY_VERIFIED) whose defining characteristic is its own local-time window, not a
# live-trading claim about what "Asian session" means; it has no order-submitting code path.
# Forcing it to canonical UTC hours would corrupt that replay's fidelity, not fix a bug. Flagged
# here as a documented, deliberate exception -- see CANONICAL_SESSION_MIGRATION_REPORT.md.
mode: historical_research_only
strategy_id: SESSION_USER_RESOLVED_V2
contract_version: "2.0-provisional"
activation_status: BACKTESTABLE_RESEARCH_ONLY

provenance:
  classification: USER_SUPPLIED_TRANSCRIPT_MAPPING
  supplied_utc: "2026-08-12"
  claimed_primary_source: "1BullBear Episode 18: Asian Session Trading"
  verification_status: NOT_INDEPENDENTLY_VERIFIED
  source_truth_precedence:
    - user-supplied visual decision-tree screenshot
    - timestamped primary transcript or video inspection
    - user-supplied transcript mapping
  conflicts_with_visual_baseline:
    stop_policy:
      visual_rule: "SL = 25% of session range"
      supplied_mapping: "sweep wick extreme plus spread OR fixed 25% range"
      transcript_evidence_claim: "00:18:49 and 00:44:33 specify a 25% stop-loss distance"
      resolution: "fixed 25% range is canonical; wick plus spread is an experimental execution heuristic"
    trend_management:
      visual_rule: "close 75% at 4R and trail remainder"
      transcript_accounting_claim: "00:18:49, 00:27:18 and 00:58:24 score full wins +5R and stops -1R"
      supplied_mapping: "close 75% at 4R, move remainder to breakeven, then trail"
      resolution: "preserve as separate accounting and execution profiles; do not mix their R results"

session:
  timezone: Europe/London
  asian_start_local: "00:00"
  asian_end_local: "08:00"
  required_m15_candles: 32
  daylight_saving_policy: IANA_EUROPE_LONDON
  london_entry_end_local: "10:00"
  execution_session: LONDON_OPEN

bias:
  asian_direction_required: true
  h1_structure_required: true
  bullish: "asian_close > asian_open AND h1_structure == BULLISH"
  bearish: "asian_close < asian_open AND h1_structure == BEARISH"
  h1_swing_detection_algorithm: FRACTAL_3_CANDLE
  h1_completed_candle_lookback: 48
  equal_tolerance_pips: 2
  bullish_structure: "last_swing_high > prior_swing_high AND last_swing_low > prior_swing_low"
  bearish_structure: "last_swing_high < prior_swing_high AND last_swing_low < prior_swing_low"
  mixed_or_equal_structure: UNCERTAIN

classification:
  range: "abs(asian_close - asian_open) <= 0.50 * asian_range"
  trend: "abs(asian_close - asian_open) > 0.50 * asian_range"
  uncertain_on_bias_disagreement: true

sweep:
  timeframe: M15
  bullish: "low < asian_low AND close > asian_low"
  bearish: "high > asian_high AND close < asian_high"
  double_sweep_before_entry: NO_TRADE
  entry: SWEEP_CANDLE_CLOSE

entries:
  SWEEP: SWEEP_CANDLE_CLOSE
  RANGE: SESSION_TOP_OR_BOTTOM
  TREND: SESSION_MIDPOINT

risk:
  canonical_stop_distance: "0.25 * asian_range"
  canonical_stop_provenance: USER_SUPPLIED_TIMESTAMPED_TRANSCRIPT_MAPPING
  experimental_stop_profile:
    id: SWEEP_WICK_SPREAD_EXPERIMENT
    distance: "abs(sweep_candle_close - (sweep_extreme +/- spread))"
    provenance: EXECUTION_HEURISTIC
    enabled: false
  final_target_r: 5.0

management:
  selected_profile: VISUAL_SETUP_SPECIFIC
  profiles:
    TRANSCRIPT_BINARY_5R:
      provenance: USER_SUPPLIED_TIMESTAMPED_TRANSCRIPT_AND_BACKTEST_MAPPING
      position_at_entry_percent: 100
      winning_exit_r: 5.0
      stopped_exit_r: -1.0
      full_win_realized_r: 5.0
      trailing: false
    VISUAL_SETUP_SPECIFIC:
      provenance: USER_SUPPLIED_EPISODE_18_DECISION_TREE_SCREENSHOT
      SWEEP:
        partial_target: SESSION_RANGE_OBJECTIVE
        partial_close_percent: 75
        runner_stop: BREAKEVEN
        runner_target_r: 5
        full_5r_run_realized_r_if_partial_is_4r: 4.25
      RANGE:
        partial_target: SESSION_RANGE_OBJECTIVE
        partial_close_percent: 75
        runner_stop: BREAKEVEN
        runner_target_r: 5
        full_5r_run_realized_r_if_partial_is_4r: 4.25
      TREND:
        partial_target_r: 4
        partial_close_percent: 75
        runner_initial_stop: BREAKEVEN
        runner_exit: M15_FRACTAL_3_CANDLE_TRAILING_STOP
        trailing_update: COMPLETED_M15_CANDLE_CLOSE
        long_ratchet: "max(current_stop, newest_confirmed_swing_low)"
        short_ratchet: "min(current_stop, newest_confirmed_swing_high)"
    UNIVERSAL_PARTIAL_TRAIL_HEURISTIC:
      provenance: USER_EXECUTION_HEURISTIC
      partial_target_r: 4
      partial_close_percent: 75
      runner_initial_stop: BREAKEVEN
      runner_exit: TRAILING_STOP
      enabled: false
  accounting_rule: "Results from different profiles must be reported separately and never pooled as the same strategy"

execution_permissions:
  calculate_signals: false
  calculate_hypothetical_volume: false
  submit_orders: true
  modify_orders: true
  close_positions: true
